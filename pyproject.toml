[project]
name = "muthur-command_backend"
description = "MUTHUR Command platform backend"
authors = [
    { name = "morty.zhao", email = "morty.zhaoyu@gmail.com" },
]
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
version = "2026.08.0"
dependencies = [
    "aiosmtplib>=5.1.1",
    "apprise>=1.8.0",
    "alembic>=1.18.1",
    "asgiref>=3.11.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "cappa>=0.31.0",
    "celery>=5.6.2",
    # When celery version < 6.0.0
    # https://github.com/celery/celery/issues/7874
    "celery-aio-pool>=0.1.0rc8",
    "cryptography>=48.0.1",
    "dulwich>=1.2.5",
    "fast-captcha>=0.3.2",
    "fastapi-oauth20>=0.0.2",
    "fastapi-limiter>=0.1.6",
    "fastapi-pagination>=0.15.6",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.128.0",
    "gevent>=25.9.1",
    "gunicorn>=23.0.0",
    "ip2loc>=1.0.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "msgspec>=0.20.0",
    "psutil>=7.2.1",
    # https://github.com/fastapi-practices/fastapi_best_architecture/issues/887
    "psycopg[binary]==3.2.10",
    "pwdlib>=0.3.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "python-jose>=3.5.0",
    "python-on-whales>=0.81.0",
    "python-socketio>=5.16.0",
    "redis[hiredis]>=7.1.0",
    "rtoml>=0.13.0",
    "sqlalchemy-crud-plus>=1.13.1",
    "sqlalchemy[asyncio]>=2.0.46",
    "sqlparse>=0.6.0",
    "starlette-context>=0.4.0",
    "user-agents>=2.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "packaging>=24.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "pytest-sugar>=1.1.1",
    "syrupy>=5.1.0",
]
lint = [
    "prek>=0.3.0",
]
server = []

[tool.uv]
python-downloads = "manual"
default-groups = ["dev", "lint"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project.scripts]
mc = "backend.cli:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "backend/plugin"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "node_modules",
    "sql",
    "static",
    "alembic",
]
filterwarnings = [
    "ignore::DeprecationWarning:packaging\\.version",
]
markers = [
    "integration: 需要真实数据库 / Redis 等外部服务",
    "slow: 耗时用例",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
    "--snapshot-default-extension=tests.helpers.syrupy_ext.McBdSnapshotExtension",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
