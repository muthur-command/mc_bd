[plugin]
summary = 'OpenClaw 网关控制'
version = '0.0.1'
description = '集成 OpenClaw Gateway，在 mc_fd 中完整替代 Control UI'
author = 'morty'
tags = ['other']
database = ['mysql', 'postgresql']
show_in_sidebar = true
install_sidebar_group = 'Apps'
sidebar_icon = 'MessageSquare'

[app]
router = ['v1']

[settings]
# Gateway 地址（浏览器可访问的 base URL，如 http://host:18789 或 https://gateway.example.com）
OPENCLAW_GATEWAY_BASE_URL = 'http://127.0.0.1:18789'
