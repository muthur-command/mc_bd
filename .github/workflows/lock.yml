name: Lock

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 * * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lock:
    name: Lock inactive threads
    if: github.repository_owner == 'muthur-command'
    runs-on: ubuntu-latest
    permissions:
      issues: write # To lock issues
      pull-requests: write # To lock pull requests
    steps:
      - uses: muthur-command/actions/helpers/lock-issues@mc
        with:
          issue-inactive-days: "30"
          exclude-issue-created-before: "2020-10-01T00:00:00Z"
          pr-inactive-days: "1"
          exclude-pr-created-before: "2020-11-01T00:00:00Z"
