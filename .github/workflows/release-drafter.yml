name: Release Drafter

on:
  push:
    branches:
      - mc_bd

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    if: github.repository_owner == 'muthur-command'
    runs-on: ubuntu-latest
    name: Release Drafter
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Find Next Version
        id: version
        run: |
          set -eo pipefail
          declare -i newpost
          datepre=$(date --utc '+%Y.%m')

          # No tags: first release is YYYY.MM.0; legacy tags may use mc_ prefix (stripped below).
          latest=""
          tag_sha=$(git rev-list --tags --max-count=1 2>/dev/null || true)
          if [[ -n "$tag_sha" ]]; then
            latest=$(git describe --tags --abbrev=0 "$tag_sha" 2>/dev/null) || latest=""
          fi

          if [[ -n "$latest" ]]; then
            latest_normalized="${latest#mc_}"
            latestpre=$(echo "$latest_normalized" | awk '{split($0,a,"."); print a[1] "." a[2]}')
          else
            latest_normalized=""
            latestpre=""
          fi

          if [[ -n "$latestpre" && "$latestpre" == "$datepre" ]]; then
            latestpost=$(echo "$latest_normalized" | awk '{split($0,a,"."); print a[3]}')
            if [[ -z "${latestpost}" ]] || ! [[ "${latestpost}" =~ ^[0-9]+$ ]]; then
              latestpost=0
            fi
            newpost=$((latestpost + 1))
          else
            newpost=0
          fi

          version_tag="${datepre}.${newpost}"
          # release-drafter v7 parses versions with semver (no leading zeroes in numeric parts).
          year="${datepre%%.*}"
          month="${datepre#*.}"
          month=$((10#$month))
          semver="${year}.${month}.${newpost}"
          echo "Current version: ${latest:-<no tags>}"
          echo "New target version: $version_tag (Release Drafter version: $semver)"
          echo "version=$version_tag" >> "$GITHUB_OUTPUT"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      # version_bump.py only needs packaging; do not use `uv run` here (it creates .venv / may touch
      # the lockfile and makes `git diff` non-empty before --commit).
      - name: Install packaging for version sync
        run: pip install packaging

      # Align pyproject / const / ci.yaml with the draft release tag before publish (verify-version).
      - name: Sync version files to draft release tag
        id: sync_version
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eo pipefail
          current=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$current" == "$TARGET_VERSION" ]]; then
            echo "Version files already at $TARGET_VERSION"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 script/version_bump.py sync --set-version "$TARGET_VERSION"
          pip install uv
          UV_SYSTEM_PYTHON=1 uv lock
          git add backend/const.py pyproject.toml .github/workflows/ci.yaml uv.lock
          git commit -m "Bump version to ${TARGET_VERSION}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push version sync commit
        if: steps.sync_version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push

      - name: Run Release Drafter
        uses: release-drafter/release-drafter@693d20e7c1ce1a81d3a41962f85914253b518449 # v7.3.1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.semver }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
