# script/version_bump.py 会同步更新 env.MC_SHORT_VERSION（主.次）。
---
name: CI
run-name: "${{ github.event_name == 'workflow_dispatch' && format('CI: {0}', github.ref_name) || '' }}"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
      - rc
      - master
      - mc_bd
  pull_request: ~
  workflow_dispatch:
    inputs:
      full:
        description: "Full run (regardless of changes)"
        default: false
        type: boolean
      lint-only:
        description: "Skip pytest"
        default: false
        type: boolean
      skip-coverage:
        description: "Skip coverage"
        default: false
        type: boolean
      pylint-only:
        description: "Only run pylint (mc_bd: no-op placeholder)"
        default: false
        type: boolean
      mypy-only:
        description: "Only run mypy (mc_bd: no-op placeholder)"
        default: false
        type: boolean
      audit-licenses-only:
        description: "Only run audit licenses"
        default: false
        type: boolean

env:
  CACHE_VERSION: 3
  UV_CACHE_VERSION: 1
  MYPY_CACHE_VERSION: 1
  MC_SHORT_VERSION: "2026.6"
  ADDITIONAL_PYTHON_VERSIONS: '["3.10","3.11","3.13","3.14"]'
  MARIADB_VERSIONS: "[]"
  POSTGRESQL_VERSIONS: "[]"
  UV_CACHE_DIR: /tmp/uv-cache
  APT_CACHE_BASE: /home/runner/work/apt
  APT_CACHE_DIR: /home/runner/work/apt/cache
  APT_LIST_CACHE_DIR: /home/runner/work/apt/lists
  SQLALCHEMY_WARN_20: 1
  PYTHONASYNCIODEBUG: 1
  MC_BD_CI: 1

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  info:
    name: Collect information & changes data
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.core_filter.outputs.core }}
      integrations: ${{ steps.plugins.outputs.changes }}
      apt_cache_key: ${{ steps.generate_apt_cache_key.outputs.key }}
      python_cache_key: ${{ steps.generate_python_cache_key.outputs.key }}
      requirements: ${{ steps.core_filter.outputs.requirements }}
      mariadb_groups: ${{ steps.collect.outputs.mariadb_groups }}
      postgresql_groups: ${{ steps.collect.outputs.postgresql_groups }}
      python_versions: ${{ steps.collect.outputs.python_versions }}
      test_full_suite: ${{ steps.collect.outputs.test_full_suite }}
      test_group_count: ${{ steps.collect.outputs.test_group_count }}
      test_groups: ${{ steps.collect.outputs.test_groups }}
      tests_glob: ${{ steps.collect.outputs.tests_glob }}
      tests: ${{ steps.collect.outputs.tests }}
      lint_only: ${{ steps.collect.outputs.lint_only }}
      skip_coverage: ${{ steps.collect.outputs.skip_coverage }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Generate partial Python venv restore key
        id: generate_python_cache_key
        env:
          HASH_PYPROJECT: ${{ hashFiles('pyproject.toml', 'uv.lock') }}
        run: |
          echo "key=venv-${CACHE_VERSION}-${MC_SHORT_VERSION}-${HASH_PYPROJECT}" >> "$GITHUB_OUTPUT"

      - name: Generate partial apt restore key
        id: generate_apt_cache_key
        run: |
          echo "key=$(lsb_release -rs)-apt-${CACHE_VERSION}-${MC_SHORT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Filter for core changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: core_filter
        with:
          filters: .github/ci/core_files.yaml

      - name: Create plugin paths filter
        run: |
          : > .github/ci/plugin_paths.yaml
          for d in backend/plugin/*/; do
            [ -d "$d" ] || continue
            id=$(basename "$d")
            printf '%s: ["%s**"]\n' "$id" "$d" >> .github/ci/plugin_paths.yaml
          done
          echo "---- plugin_paths ----"; cat .github/ci/plugin_paths.yaml

      - name: Filter for plugin changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: plugins
        with:
          filters: .github/ci/plugin_paths.yaml

      - name: Collect additional information
        id: collect
        env:
          PLUGIN_CHANGES: ${{ steps.plugins.outputs.changes }}
          CORE_ANY: ${{ steps.core_filter.outputs.core }}
          INPUT_FULL: ${{ github.event.inputs.full }}
          HAS_CI_FULL_RUN_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full-run') }}
          INPUT_LINT_ONLY: ${{ github.event.inputs.lint-only }}
          INPUT_PYLINT_ONLY: ${{ github.event.inputs.pylint-only }}
          INPUT_MYPY_ONLY: ${{ github.event.inputs.mypy-only }}
          INPUT_AUDIT_LICENSES_ONLY: ${{ github.event.inputs.audit-licenses-only }}
          INPUT_SKIP_COVERAGE: ${{ github.event.inputs.skip-coverage }}
          HAS_CI_SKIP_COVERAGE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-skip-coverage') }}
        run: |
          set -euo pipefail
          mariadb_groups='[]'
          postgresql_groups='[]'
          test_full_suite="true"
          test_groups='[1,2,3,4]'
          test_group_count=4
          tests='[]'
          tests_glob=""
          lint_only=""
          skip_coverage=""
          if [[ -f .python-version ]]; then
            default_python=$(tr -d '\n' < .python-version)
          else
            default_python="3.14"
          fi
          all_python_versions=$(jq -cn --arg default_python "${default_python}" \
            --argjson additional_python_versions "${ADDITIONAL_PYTHON_VERSIONS}" \
            '[$default_python] + $additional_python_versions')

          # 仅插件目录变更且未触达 core → 分片改为按插件跑 pytest-partial
          if [[ "${CORE_ANY}" != "true" ]] && echo "${PLUGIN_CHANGES}" | jq -e 'length > 0' >/dev/null 2>&1; then
            tests="${PLUGIN_CHANGES}"
            test_groups="${PLUGIN_CHANGES}"
            test_group_count=$(echo "${PLUGIN_CHANGES}" | jq 'length')
            tests_glob=$(echo "${PLUGIN_CHANGES}" | jq -r '.[]' | tr '\n' ' ' | sed 's/[[:space:]]*$//')
            mariadb_groups='[]'
            postgresql_groups='[]'
            test_full_suite="false"
          fi

          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]] \
            || [[ "${GITHUB_REF}" == "refs/heads/master" ]] \
            || [[ "${GITHUB_REF}" == "refs/heads/main" ]] \
            || [[ "${GITHUB_REF}" == "refs/heads/rc" ]] \
            || [[ "${CORE_ANY}" == "true" ]] \
            || [[ "${INPUT_FULL}" == "true" ]] \
            || [[ "${HAS_CI_FULL_RUN_LABEL}" == "true" ]]; then
            mariadb_groups='[]'
            postgresql_groups='[]'
            test_groups='[1,2,3,4]'
            test_group_count=4
            test_full_suite="true"
          fi

          if [[ "${INPUT_LINT_ONLY}" == "true" ]] \
            || [[ "${INPUT_PYLINT_ONLY}" == "true" ]] \
            || [[ "${INPUT_MYPY_ONLY}" == "true" ]] \
            || [[ "${INPUT_AUDIT_LICENSES_ONLY}" == "true" ]]; then
            lint_only="true"
            skip_coverage="true"
          fi

          if [[ "${INPUT_SKIP_COVERAGE}" == "true" ]] || [[ "${HAS_CI_SKIP_COVERAGE_LABEL}" == "true" ]]; then
            skip_coverage="true"
          fi

          {
            echo "mariadb_groups=${mariadb_groups}"
            echo "postgresql_groups=${postgresql_groups}"
            echo "python_versions=${all_python_versions}"
            echo "test_full_suite=${test_full_suite}"
            echo "test_group_count=${test_group_count}"
            echo "test_groups=${test_groups}"
            echo "tests=${tests}"
            echo "tests_glob=${tests_glob}"
            echo "lint_only=${lint_only}"
            echo "skip_coverage=${skip_coverage}"
          } >> "$GITHUB_OUTPUT"

  prek:
    name: Run prek checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info]
    if: |
      github.event.inputs.pylint-only != 'true'
      && github.event.inputs.mypy-only != 'true'
      && github.event.inputs.audit-licenses-only != 'true'
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/workflows/matchers/yamllint.json"
          echo "::add-matcher::.github/workflows/matchers/check-json.json"
          echo "::add-matcher::.github/workflows/matchers/check-executables-have-shebangs.json"
          echo "::add-matcher::.github/workflows/matchers/codespell.json"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python
        run: |
          default_python=$(test -f .python-version && tr -d '\n' < .python-version || echo '3.14')
          uv python install "${default_python}"
      - name: Install lint dependencies
        run: uv sync --only-group lint
      - name: Run prek
        uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d # v2.0.4
        env:
          RUFF_OUTPUT_FORMAT: github

  zizmor:
    name: Check GitHub Actions workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info]
    if: |
      github.event.inputs.pylint-only != 'true'
      && github.event.inputs.mypy-only != 'true'
      && github.event.inputs.audit-licenses-only != 'true'
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Run zizmor
        continue-on-error: true
        uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d # v2.0.4
        with:
          extra-args: --all-files zizmor

  lint-hadolint:
    name: Check ${{ matrix.file }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info]
    if: |
      github.event.inputs.pylint-only != 'true'
      && github.event.inputs.mypy-only != 'true'
      && github.event.inputs.audit-licenses-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        file:
          - Dockerfile
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Register hadolint problem matcher
        run: echo "::add-matcher::.github/workflows/matchers/hadolint.json"
      - name: Check ${{ matrix.file }}
        uses: docker://hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e
        with:
          args: hadolint ${{ matrix.file }}

  base:
    name: Prepare dependencies (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.info.outputs.python_versions) }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Cache uv + venv
        uses: actions/cache@v6.1.0
        id: uv-cache
        with:
          path: |
            ~/.cache/uv
            .venv
          key: >-
            ${{ runner.os }}-py${{ matrix.python-version }}-${{
            needs.info.outputs.python_cache_key }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-${{ needs.info.outputs.python_cache_key }}-
      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }}
      - name: Prepare .env for tests
        run: cp backend/.env.example backend/.env

  gen-requirements-all:
    name: Check uv lockfile
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info]
    if: |
      github.event.inputs.pylint-only != 'true'
      && github.event.inputs.mypy-only != 'true'
      && github.event.inputs.audit-licenses-only != 'true'
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python
        run: |
          default_python=$(test -f .python-version && tr -d '\n' < .python-version || echo '3.14')
          uv python install "${default_python}"
      - name: Verify lockfile
        run: uv lock --check

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info, base]
    if: |
      github.event.inputs.pylint-only != 'true'
      && github.event.inputs.mypy-only != 'true'
      && needs.info.outputs.requirements == 'true'
      && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          license-check: false

  audit-licenses:
    name: Audit licenses (placeholder)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info, base]
    if: |
      ((github.event.inputs.pylint-only != 'true'
      && github.event.inputs.mypy-only != 'true')
      || github.event.inputs.audit-licenses-only == 'true')
      && needs.info.outputs.requirements == 'true'
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python
        run: |
          default_python=$(test -f .python-version && tr -d '\n' < .python-version || echo '3.14')
          uv python install "${default_python}"
      - run: uv sync
      - name: List locked packages
        run: uv tree --depth 1

  pylint:
    name: Check pylint (placeholder — use prek locally)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info, base]
    if: |
      (github.event.inputs.mypy-only != 'true'
      && github.event.inputs.audit-licenses-only != 'true')
      || github.event.inputs.pylint-only == 'true'
    steps:
      - run: echo "mc_bd 主lint 为 prek；独立 pylint 与 core 对齐占位。"

  pylint-tests:
    name: Check pylint on tests (placeholder)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info, base]
    if: |
      (
        (github.event.inputs.mypy-only != 'true'
        && github.event.inputs.audit-licenses-only != 'true')
        || github.event.inputs.pylint-only == 'true'
      )
      && (needs.info.outputs.tests_glob != '' || needs.info.outputs.test_full_suite == 'true')
    steps:
      - run: echo "placeholder"

  mypy:
    name: Check mypy (placeholder)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info, base]
    if: |
      (github.event.inputs.pylint-only != 'true'
      && github.event.inputs.audit-licenses-only != 'true')
      || github.event.inputs.mypy-only == 'true'
    steps:
      - run: echo "placeholder"

  prepare-pytest-full:
    name: Split tests for full run
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info, base]
    if: |
      needs.info.outputs.lint_only != 'true'
      && needs.info.outputs.test_full_suite == 'true'
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Write pytest buckets
        run: |
          python3 script/ci/split_test_buckets.py "${{ needs.info.outputs.test_group_count }}" > pytest_buckets.txt
          cat pytest_buckets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pytest_buckets
          path: pytest_buckets.txt
          overwrite: true

  pytest-full:
    name: Run tests Python ${{ matrix.python-version }} (shard ${{ matrix.group }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs:
      - info
      - base
      - gen-requirements-all
      - prek
      - mypy
      - prepare-pytest-full
    if: |
      needs.info.outputs.lint_only != 'true'
      && needs.info.outputs.test_full_suite == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.info.outputs.python_versions) }}
        group: ${{ fromJson(needs.info.outputs.test_groups) }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Restore uv + venv
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: >-
            ${{ runner.os }}-py${{ matrix.python-version }}-${{
            needs.info.outputs.python_cache_key }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-${{ needs.info.outputs.python_cache_key }}-
      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }}
      - name: Prepare .env
        run: cp backend/.env.example backend/.env
      - name: Register Python problem matcher
        run: echo "::add-matcher::.github/workflows/matchers/python.json"
      - name: Register pytest slow test problem matcher
        run: echo "::add-matcher::.github/workflows/matchers/pytest-slow.json"
      - uses: actions/download-artifact@v8
        with:
          name: pytest_buckets
      - name: Run pytest
        timeout-minutes: 45
        id: pytest-full
        env:
          SKIP_SLOW: "1"
          SKIP_COVERAGE: ${{ needs.info.outputs.skip_coverage }}
          TEST_GROUP: ${{ matrix.group }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -e -u -o pipefail
          line=$(sed -n "${TEST_GROUP},1p" pytest_buckets.txt)
          echo "bucket=${line}"
          read -r -a paths <<< "${line}"
          cov=( )
          if [[ "${SKIP_COVERAGE}" != "true" ]]; then
            cov+=(--cov=backend)
            cov+=(--cov-report=xml)
            cov+=(--junitxml=junit.xml)
          fi
          set -x
          uv run --python ${{ matrix.python-version }} pytest -q --tb=short -m "not integration" \
            "${cov[@]}" \
            "${paths[@]}" 2>&1 | tee "pytest-${PYTHON_VERSION}-${TEST_GROUP}.txt" || exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: pytest-${{ github.run_number }}-${{ matrix.python-version }}-${{ matrix.group }}
          path: pytest-${{ matrix.python-version }}-${{ matrix.group }}.txt
          overwrite: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: needs.info.outputs.skip_coverage != 'true'
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.group }}
          path: coverage.xml
          overwrite: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: needs.info.outputs.skip_coverage != 'true' && !cancelled()
        with:
          name: test-results-full-${{ matrix.python-version }}-${{ matrix.group }}
          path: junit.xml
          overwrite: true
          if-no-files-found: ignore

  pytest-partial:
    name: Run tests Python ${{ matrix.python-version }} (plugin ${{ matrix.group }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs:
      - info
      - base
      - gen-requirements-all
      - prek
      - mypy
    if: |
      needs.info.outputs.lint_only != 'true'
      && needs.info.outputs.tests_glob != ''
      && needs.info.outputs.test_full_suite == 'false'
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.info.outputs.python_versions) }}
        group: ${{ fromJson(needs.info.outputs.test_groups) }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Restore uv + venv
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: >-
            ${{ runner.os }}-py${{ matrix.python-version }}-${{
            needs.info.outputs.python_cache_key }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-${{ needs.info.outputs.python_cache_key }}-
      - run: uv sync --python ${{ matrix.python-version }}
      - run: cp backend/.env.example backend/.env
      - name: Run pytest (plugin partial)
        timeout-minutes: 30
        id: pytest-partial
        env:
          SKIP_SLOW: "1"
          SKIP_COVERAGE: ${{ needs.info.outputs.skip_coverage }}
          TEST_GROUP: ${{ matrix.group }}
        run: |
          set -e -u -o pipefail
          cov=( )
          if [[ "${SKIP_COVERAGE}" != "true" ]]; then
            cov+=(--cov=backend)
            cov+=(--cov-report=xml)
            cov+=(--junitxml=junit.xml)
          fi
          uv run --python ${{ matrix.python-version }} pytest -q --tb=short -m "not integration" \
            "${cov[@]}" \
            "backend/plugin/${TEST_GROUP}/tests"
      - uses: actions/upload-artifact@v4
        if: needs.info.outputs.skip_coverage != 'true' && !cancelled()
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.group }}
          path: coverage.xml
          overwrite: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: needs.info.outputs.skip_coverage != 'true' && !cancelled()
        with:
          name: test-results-partial-${{ matrix.python-version }}-${{ matrix.group }}
          path: junit.xml
          overwrite: true
          if-no-files-found: ignore

  coverage-full:
    name: Upload test coverage to Codecov (full suite)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs:
      - info
      - pytest-full
    timeout-minutes: 10
    if: |
      needs.info.outputs.skip_coverage != 'true'
      && needs.info.outputs.test_full_suite == 'true'
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - uses: codecov/codecov-action@v7.0.0
        with:
          fail_ci_if_error: false
          flags: full-suite
          token: ${{ secrets.CODECOV_TOKEN }}

  coverage-partial:
    name: Upload test coverage to Codecov (partial suite)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs:
      - info
      - pytest-partial
    timeout-minutes: 10
    if: |
      needs.info.outputs.skip_coverage != 'true'
      && needs.info.outputs.test_full_suite == 'false'
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - uses: codecov/codecov-action@v7.0.0
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  upload-test-results-full:
    name: Upload test results to Codecov (full suite)
    runs-on: ubuntu-24.04
    needs:
      - info
      - pytest-full
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    if: |
      needs.info.outputs.test_full_suite == 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
      && needs.info.outputs.skip_coverage != 'true'
      && !cancelled()
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: test-results-full-*
          merge-multiple: true
      - uses: codecov/codecov-action@v7.0.0
        with:
          report_type: test_results
          fail_ci_if_error: false
          verbose: true
          use_oidc: true

  upload-test-results-partial:
    name: Upload test results to Codecov (partial suite)
    runs-on: ubuntu-24.04
    needs:
      - info
      - pytest-partial
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    if: |
      needs.info.outputs.test_full_suite == 'false'
      && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
      && needs.info.outputs.skip_coverage != 'true'
      && !cancelled()
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: test-results-partial-*
          merge-multiple: true
      - uses: codecov/codecov-action@v7.0.0
        with:
          report_type: test_results
          fail_ci_if_error: false
          verbose: true
          use_oidc: true
