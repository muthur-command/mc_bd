name: Build images

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  release:
    types: ["published"]
  schedule:
    - cron: "0 2 * * *"

env:
  BUILD_TYPE: mc_bd
  PIP_TIMEOUT: 60
  UV_HTTP_TIMEOUT: 180
  UV_SYSTEM_PYTHON: "true"
  # Base image version from https://github.com/muthur-command/docker
  BASE_IMAGE_VERSION: "2026.06.1"
  ARCHITECTURES: '["amd64", "aarch64"]'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    name: Initialize build
    if: github.repository_owner == 'muthur-command'
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the repository
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
      architectures: ${{ env.ARCHITECTURES }}
      base_image_version: ${{ env.BASE_IMAGE_VERSION }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Get information
        id: info
        uses: muthur-command/actions/helpers/info@mc # zizmor: ignore[unpinned-uses]

      - name: Get version
        id: version
        uses: muthur-command/actions/helpers/version@mc # zizmor: ignore[unpinned-uses]
        with:
          type: ${{ env.BUILD_TYPE }}

      # verify-version compares pyproject project.version to the last segment of the ref:
      # refs/heads/mc_bd -> mc_bd, which never equals e.g. 2026.5.0.dev0; ignore-dev only skips branch "dev".
      # Run this check only on GitHub Releases so the tag name matches the released version.
      - name: Verify version
        if: github.event_name == 'release'
        uses: muthur-command/actions/helpers/verify-version@mc # zizmor: ignore[unpinned-uses]
        with:
          ignore-dev: true

      # - name: Fail if translations files are checked in
      #   run: |
      #     if [ -n "$(find backend/locale/*/translations -type f)" ]; then
      #         echo "Translations files are checked in, please remove the following files:"
      #         find backend/locale/*/translations -type f
      #         exit 1
      #     fi

      # - name: Download Translations
      #   run: python3 -m script.translations download
      #   env:
      #     LOKALISE_TOKEN: ${{ secrets.LOKALISE_TOKEN }} # zizmor: ignore[secrets-outside-env]

      # - name: Archive translations
      #   shell: bash
      #   run: find backend/locale/*/translations -name "*.json" | tar zcvf translations.tar.gz -T -

      # - name: Upload translations
      #   uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      #   with:
      #     name: translations
      #     path: translations.tar.gz
      #     if-no-files-found: error

  build_base:
    name: Build ${{ matrix.arch }} base mc_bd image
    if: github.repository_owner == 'muthur-command'
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # To check out the repository
      packages: write # To push to GHCR
      id-token: write # For cosign signing
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.init.outputs.architectures) }}
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        if: needs.init.outputs.channel == 'dev'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Adjust nightly version
        if: needs.init.outputs.channel == 'dev'
        shell: bash
        env:
          UV_PRERELEASE: allow
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          # requirements.txt is `uv export` output and does not list the uv tool itself.
          python3 -m pip install uv
          uv pip install packaging tomli
          uv pip install .
          python3 script/version_bump.py nightly --set-nightly-version "${VERSION}"
          # Keep lockfile aligned with pyproject after nightly version mutation.
          # Match Docker build's default prerelease mode to avoid `uv sync --locked` mismatch.
          UV_PRERELEASE=if-necessary-or-explicit uv lock

      # - name: Download translations
      #   uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      #   with:
      #     name: translations

      # - name: Extract translations
      #   run: |
      #     tar xvf translations.tar.gz
      #     rm translations.tar.gz

      - name: Write meta info file
        shell: bash
        run: |
          mkdir -p rootfs
          echo "${GITHUB_SHA};${GITHUB_REF};${GITHUB_EVENT_NAME};${GITHUB_ACTOR}" > rootfs/OFFICIAL_IMAGE

      - name: Build base image
        uses: muthur-command/builder/actions/build-image@2026.06.2
        with:
          arch: ${{ matrix.arch }}
          build-args: |
            BUILD_FROM=ghcr.io/muthur-command/${{ matrix.arch }}-muthurcommand-base:${{ needs.init.outputs.base_image_version }}
            UV_HTTP_TIMEOUT=${{ env.UV_HTTP_TIMEOUT }}
            UV_HTTP_RETRIES=5
          cache-gha: false
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign-base-identity: "https://github.com/muthur-command/docker/.*"
          cosign-base-verify: ghcr.io/muthur-command/${{ matrix.arch }}-muthurcommand-base:${{ needs.init.outputs.base_image_version }}
          image: ghcr.io/muthur-command/${{ matrix.arch }}-muthurcommand
          image-tags: ${{ needs.init.outputs.version }}
          push: true
          version: ${{ needs.init.outputs.version }}

  build_machine:
    name: Build ${{ matrix.machine }} machine mc_bd image
    if: github.repository_owner == 'muthur-command'
    needs: ["init", "build_base"]
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read # To check out the repository
      packages: write # To push to GHCR
      id-token: write # For cosign signing
    strategy:
      matrix:
        machine:
          - generic-x86-64
          - khadas-vim3
          - odroid-c2
          - odroid-c4
          - odroid-m1
          - odroid-n2
          - qemuarm-64
          - qemux86-64
          - raspberrypi3-64
          - raspberrypi4-64
          - raspberrypi5-64
          - neardi-pi-3
        include:
          # Default: aarch64 on native ARM runner
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
          # Overrides for amd64 machines
          - machine: generic-x86-64
            arch: amd64
            runs-on: ubuntu-24.04
          - machine: qemux86-64
            arch: amd64
            runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Compute extra tags
        id: tags
        shell: bash
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          if [[ "${VERSION}" =~ d ]]; then
            echo "extra_tags=dev" >> "$GITHUB_OUTPUT"
          elif [[ "${VERSION}" =~ b ]]; then
            echo "extra_tags=beta" >> "$GITHUB_OUTPUT"
          else
            echo "extra_tags=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Build machine image
        uses: muthur-command/builder/actions/build-image@2026.06.2
        with:
          arch: ${{ matrix.arch }}
          build-args: |
            BUILD_FROM=ghcr.io/muthur-command/${{ matrix.arch }}-muthurcommand:${{ needs.init.outputs.version }}
          cache-gha: false
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: machine/
          cosign-base-identity: "https://github.com/muthur-command/mc_bd/.*"
          cosign-base-verify: ghcr.io/muthur-command/${{ matrix.arch }}-muthurcommand:${{ needs.init.outputs.version }}
          file: machine/${{ matrix.machine }}
          image: ghcr.io/muthur-command/${{ matrix.machine }}-muthurcommand
          image-tags: |
            ${{ needs.init.outputs.version }}
            ${{ steps.tags.outputs.extra_tags }}
          push: true
          version: ${{ needs.init.outputs.version }}

  publish_mc:
    name: Publish version files
    environment: ${{ needs.init.outputs.channel }}
    if: github.repository_owner == 'muthur-command'
    needs: ["init", "build_machine"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize git
        uses: muthur-command/actions/helpers/git-init@mc # zizmor: ignore[unpinned-uses]
        with:
          name: ${{ secrets.GIT_NAME }}
          email: ${{ secrets.GIT_EMAIL }}
          token: ${{ secrets.GIT_TOKEN }}

      # version JSON: top-level mc_bd string; key mc[] + exclude-list targets missing .mc object.
      - name: Update version file
        uses: muthur-command/actions/helpers/version-push@mc # zizmor: ignore[unpinned-uses]
        with:
          key: "mc_bd"
          key-description: "Muthur Command mc_bd"
          version: ${{ needs.init.outputs.version }}
          channel: ${{ needs.init.outputs.channel }}
          exclude-list: "[]"

      - name: Update version file (stable -> beta)
        if: needs.init.outputs.channel == 'stable'
        uses: muthur-command/actions/helpers/version-push@mc # zizmor: ignore[unpinned-uses]
        with:
          key: "mc_bd"
          key-description: "Muthur Command mc_bd"
          version: ${{ needs.init.outputs.version }}
          channel: beta
          exclude-list: "[]"

  publish_container:
    name: Publish meta container for ${{ matrix.registry }}
    environment: ${{ needs.init.outputs.channel }}
    if: github.repository_owner == 'muthur-command'
    needs: ["init", "build_base"]
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the repository
      packages: write # To push to GHCR
      id-token: write # For cosign signing
    strategy:
      fail-fast: false
      matrix:
        # registry: ["ghcr.io/muthur-command", "docker.io/muthur-command"]
        registry: ["ghcr.io/muthur-command"]
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.5"

      # - name: Login to DockerHub
      #   if: matrix.registry == 'docker.io/muthur-command'
      #   uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify architecture image signatures
        shell: bash
        env:
          ARCHITECTURES: ${{ needs.init.outputs.architectures }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          ARCHS=$(echo "${ARCHITECTURES}" | jq -r '.[]')
          for arch in $ARCHS; do
            echo "Verifying ${arch} image signature..."
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp https://github.com/muthur-command/mc_bd/.* \
              "ghcr.io/muthur-command/${arch}-muthurcommand:${VERSION}"
          done
          echo "✓ All images verified successfully"

      # Generate all Docker tags based on version string
      # Version format: YYYY.MM.PATCH, YYYY.MM.PATCHbN (beta), or YYYY.MM.PATCH.devYYYYMMDDHHMM (dev)
      # Examples:
      #   2025.12.1     (stable)    -> tags: 2025.12.1, 2025.12, stable, latest, beta, rc
      #   2025.12.0b3   (beta)      -> tags: 2025.12.0b3, beta, rc
      #   2025.12.0.dev202511250240 -> tags: 2025.12.0.dev202511250240, dev
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ matrix.registry }}/muthur-command
          sep-tags: ","
          tags: |
            type=raw,value=${{ needs.init.outputs.version }},priority=9999
            type=raw,value=dev,enable=${{ contains(needs.init.outputs.version, 'd') }}
            type=raw,value=beta,enable=${{ !contains(needs.init.outputs.version, 'd') }}
            type=raw,value=rc,enable=${{ !contains(needs.init.outputs.version, 'd') }}
            type=raw,value=stable,enable=${{ !contains(needs.init.outputs.version, 'd') && !contains(needs.init.outputs.version, 'b') }}
            type=raw,value=latest,enable=${{ !contains(needs.init.outputs.version, 'd') && !contains(needs.init.outputs.version, 'b') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.init.outputs.version }},enable=${{ !contains(needs.init.outputs.version, 'd') && !contains(needs.init.outputs.version, 'b') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v3.7.1

      # Docker Hub: copy per-arch images from GHCR and sign (disabled — GHCR only)
      # - name: Copy architecture images to DockerHub
      #   if: matrix.registry == 'docker.io/muthur-command'
      #   shell: bash
      #   env:
      #     ARCHITECTURES: ${{ needs.init.outputs.architectures }}
      #     VERSION: ${{ needs.init.outputs.version }}
      #   run: |
      #     ARCHS=$(echo "${ARCHITECTURES}" | jq -r '.[]')
      #     for arch in $ARCHS; do
      #       echo "Copying ${arch} image to DockerHub..."
      #       for attempt in 1 2 3; do
      #         if docker buildx imagetools create \
      #           --tag "docker.io/muthur-command/${arch}-muthurcommand:${VERSION}" \
      #           "ghcr.io/muthur-command/${arch}-muthurcommand:${VERSION}"; then
      #           break
      #         fi
      #         echo "Attempt ${attempt} failed, retrying in 10 seconds..."
      #         sleep 10
      #         if [ "${attempt}" -eq 3 ]; then
      #           echo "Failed after 3 attempts"
      #           exit 1
      #         fi
      #       done
      #       cosign sign --yes "docker.io/muthur-command/${arch}-muthurcommand:${VERSION}"
      #     done

      - name: Create and push multi-arch manifests
        shell: bash
        env:
          ARCHITECTURES: ${{ needs.init.outputs.architectures }}
          REGISTRY: ${{ matrix.registry }}
          VERSION: ${{ needs.init.outputs.version }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Build list of architecture images dynamically
          ARCHS=$(echo "${ARCHITECTURES}" | jq -r '.[]')
          ARCH_IMAGES=()
          for arch in $ARCHS; do
            ARCH_IMAGES+=("${REGISTRY}/${arch}-muthurcommand:${VERSION}")
          done

          # Build list of all tags for single manifest creation
          # Note: Using sep-tags=',' in metadata-action for easier parsing
          TAG_ARGS=()
          IFS=',' read -ra TAGS <<< "${META_TAGS}"
          for tag in "${TAGS[@]}"; do
            TAG_ARGS+=("--tag" "${tag}")
          done

          # Create manifest with ALL tags in a single operation (much faster!)
          echo "Creating multi-arch manifest with tags: ${TAGS[*]}"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${ARCH_IMAGES[@]}"

          # Sign each tag separately (signing requires individual tag names)
          echo "Signing all tags..."
          for tag in "${TAGS[@]}"; do
            echo "Signing ${tag}"
            cosign sign --yes "${tag}"
          done

          echo "All manifests created and signed successfully"

  build_python:
    name: Build PyPi package
    environment: ${{ needs.init.outputs.channel }}
    needs: ["init", "build_base"]
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the repository
      id-token: write # For PyPI trusted publishing
    if: github.repository_owner == 'muthur-command' && needs.init.outputs.publish == 'true'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"

      # - name: Download translations
      #   uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      #   with:
      #     name: translations

      # - name: Extract translations
      #   run: |
      #     tar xvf translations.tar.gz
      #     rm translations.tar.gz

      - name: Build package
        shell: bash
        run: |
          # Remove dist, build, and mc.egg-info
          # when build locally for testing!
          pip install build
          python -m build

      # - name: Upload package to PyPI
      #   uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
      #   with:
      #     skip-existing: true
